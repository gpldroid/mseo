{{ define "main" }}
<div class="container section-block">
  <nav class="site-breadcrumb" aria-label="مسار التنقل"><a href="{{ "/" | relURL }}">الرئيسية</a><span aria-hidden="true">›</span><span aria-current="page">{{ .Title }}</span></nav>
  <header class="category-archive-header"><span class="eyebrow">فاست سيو</span><h1>{{ .Title }}</h1><p class="text-muted">تصفح الموضوعات المرتبطة بهذا الوسم.</p></header>
  <div class="directory-grid">
    {{ range .Data.Terms.Alphabetical }}
      <a class="directory-card" href="{{ .Page.RelPermalink }}"><h2>{{ .Page.Title }}</h2><span class="directory-card-meta">{{ .Count }} مقالاً</span></a>
    {{ end }}
  </div>
</div>
{{ end }}
