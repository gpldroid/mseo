<article class="post-card" data-load-item><a class="post-card-image" href="{{ .RelPermalink }}">{{ with .Params.image }}<img src="{{ . | safeURL }}" alt="{{ $.Title }}" loading="lazy" decoding="async" width="1200" height="675">{{ end }}</a><div class="post-card-body"><div class="card-meta">{{ with index .Params.categories 0 }}<span>{{ . }}</span>{{ end }}<time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time></div><h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3><p>{{ .Description | default .Summary | plainify | truncate 135 }}</p></div></article>
