<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="/" aria-label="فاست سيو - الرئيسية">
      <img class="brand-mark" src="{{ "favicon.svg" | relURL }}" alt="" width="42" height="42" decoding="async">
      <span>فاست سيو<small>Fast Seo · معرفة تقنية وأدوات عملية</small></span>
    </a>
    <nav class="main-nav" aria-label="القائمة الرئيسية">
      <a href="/" {{ if .IsHome }}aria-current="page"{{ end }}>الرئيسية</a>
      <a href="/articles/" {{ if eq .Section "articles" }}aria-current="page"{{ end }}>المقالات</a>
      <a href="/pages/tools.html" {{ if eq .RelPermalink "/pages/tools.html" }}aria-current="page"{{ end }}>الأدوات</a>
      <a href="/pages/categories.html" {{ if eq .RelPermalink "/pages/categories.html" }}aria-current="page"{{ end }}>التصنيفات</a>
      <a href="/pages/about.html" {{ if eq .RelPermalink "/pages/about.html" }}aria-current="page"{{ end }}>من نحن</a>
      <a href="/pages/contact.html" {{ if eq .RelPermalink "/pages/contact.html" }}aria-current="page"{{ end }}>اتصل بنا</a>
    </nav>
    <div class="header-actions">
      <form class="header-search" role="search" data-site-search-form autocomplete="off">
        <label class="visually-hidden" for="site-header-search">البحث عن المقالات والتصنيفات</label>
        <input id="site-header-search" type="search" name="q" aria-label="البحث في المقالات والتصنيفات" aria-controls="site-search-results" aria-autocomplete="list" data-site-search-input>
        <button class="header-search-submit" type="submit" aria-label="بحث"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"></circle><path d="m16 16 5 5"></path></svg></button>
        <div class="header-search-results" id="site-search-results" data-search-results role="listbox" aria-label="نتائج البحث" hidden></div>
      </form>
    </div>
  </div>
</header>
