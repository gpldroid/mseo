<section class="site-hero"><div class="container"><span class="eyebrow">مكتبة فاست سيو</span><h1>تصفح المقالات حسب التصنيف</h1><p class="text-muted">اختر المجال الذي يهمك للوصول إلى الأدلة والمقالات المرتبطة به.</p></div></section>
<section class="container section-block"><div class="directory-grid">
{{ range sort (where .Site.RegularPages "Section" "categories") "Title" }}
  <a class="directory-card" href="{{ .RelPermalink }}">
    <span class="directory-card-icon" aria-hidden="true"><i class="fa-solid fa-layer-group"></i></span>
    <h2>{{ .Title }}</h2>
    <p>{{ .Description }}</p>
    <span class="directory-card-meta">{{ len .Params.article_slugs }} مقالاً</span><span class="directory-card-link">تصفح التصنيف ←</span>
  </a>
{{ end }}
</div></section>
