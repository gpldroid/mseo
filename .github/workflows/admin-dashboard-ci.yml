name: Admin Dashboard CI
on:
  pull_request:
    paths:
      - 'admin-dashboard/**'
      - '.github/workflows/admin-dashboard-ci.yml'
  push:
    branches: [main]
    paths:
      - 'admin-dashboard/**'
      - '.github/workflows/admin-dashboard-ci.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-dashboard/package.json
      - run: npm install
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
