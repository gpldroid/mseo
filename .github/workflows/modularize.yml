name: Refactor Magic SEO into Modular Architecture

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Split index.html into modular files
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path(".")
          src = root / "index.html"
          html = src.read_text(encoding="utf-8")

          style_match = re.search(r"<style[^>]*>(.*?)</style>", html, re.S | re.I)
          if not style_match:
              raise SystemExit("Custom style block not found")
          css = style_match.group(1).strip() + "\n"
          html = html[:style_match.start()] + '<link rel="stylesheet" href="assets/css/style.css">' + html[style_match.end():]

          scripts = list(re.finditer(r"<script([^>]*)>(.*?)</script>", html, re.S | re.I))
          inline = [(m, m.group(2)) for m in scripts if "src=" not in m.group(1).lower() and m.group(2).strip()]
          tailwind = next((b.strip() for _, b in inline if "tailwind.config" in b), "")
          app = next((b.strip() for _, b in inline if "articlesDB" in b and "function openArticleModal" in b), "")

          if not app:
              raise SystemExit("Main application script not found")

          for m, _ in reversed(inline):
              html = html[:m.start()] + html[m.end():]

          def block(start, end):
              i = app.find(start)
              if i < 0: raise SystemExit("Missing marker: " + start)
              j = app.find(end, i)
              if j < 0: raise SystemExit("Missing end marker: " + end)
              return app[i:j].strip()

          translations = block("const translations = {", "let currentLanguage = 'ar';")
          switch = block("function switchLanguage(lang)", "function toggleDarkMode()")
          theme = block("function toggleDarkMode()", "// Check local stored theme on load")
          cookies = block("function checkCookieConsent()", "function showToast(msg)")
          toast = block("function showToast(msg)", "const articlesDB")
          articles = block("const articlesDB = [", "function openArticleModal")
          modal = block("function openArticleModal(id)", "// Font Resizer for Article Reader View")
          reader = block("// Font Resizer for Article Reader View", "// Add Comment Logic")
          comments = block("// Add Comment Logic", "// XML Code Modal Actions")
          xml = block("// XML Code Modal Actions", "// Search Overlay Trigger & Filter")
          search = block("// Search Overlay Trigger & Filter", "// Settings Drawer Toggle")
          drawer = block("// Settings Drawer Toggle", "// Dynamic Color Accent Changer")
          accent = block("function changeAccent(color)", "// Shuffle articles demo animation")
          shuffle = block("// Shuffle articles demo animation", "window.onload")

          def expose(code, names):
              for n in names:
                  code += f"\nwindow.{n} = {n};"
              return code.strip() + "\n"

          (root/"assets/css").mkdir(parents=True, exist_ok=True)
          (root/"assets/js/data").mkdir(parents=True, exist_ok=True)
          (root/"assets/js/i18n").mkdir(parents=True, exist_ok=True)
          (root/"assets/js/modules").mkdir(parents=True, exist_ok=True)

          (root/"assets/css/style.css").write_text(css, encoding="utf-8")
          (root/"assets/js/tailwind-config.js").write_text(tailwind + "\n", encoding="utf-8")

          (root/"assets/js/data/articles.js").write_text(
              articles + "\nwindow.articlesDB = articlesDB;\n", encoding="utf-8")
          (root/"assets/js/i18n/translations.js").write_text(
              translations + "\n" + switch + "\nwindow.translations = translations;\nwindow.switchLanguage = switchLanguage;\n",
              encoding="utf-8")

          theme_js = """
function initTheme() {
    const savedTheme = localStorage.getItem('magic_seo_theme');
    if (savedTheme === 'dark') document.documentElement.classList.add('dark');
}
""" + "\n" + theme + "\n" + accent
          (root/"assets/js/modules/theme.js").write_text(
              expose(theme_js, ["initTheme","toggleDarkMode","changeAccent"]), encoding="utf-8")

          modal_js = "\n".join([modal, reader, xml, search])
          (root/"assets/js/modules/modal.js").write_text(
              expose(modal_js, ["openArticleModal","closeArticleModal","changeFontSize","toggleBookmark",
                                "openXmlModal","closeXmlModal","copyXmlCode","toggleSearchModal",
                                "filterArticles","closeSearchAndOpen"]), encoding="utf-8")

          (root/"assets/js/modules/drawer.js").write_text(
              expose(drawer, ["toggleSettingsDrawer","toggleMobileDrawer"]), encoding="utf-8")

          features_js = "\n".join([toast, cookies, comments, shuffle])
          (root/"assets/js/modules/features.js").write_text(
              expose(features_js, ["showToast","checkCookieConsent","acceptCookies","declineCookies",
                                   "addComment","handleNewsletterSubmit","shuffleArticles"]), encoding="utf-8")

          main_js = """
document.addEventListener('DOMContentLoaded', function () {
    if (typeof initTheme === 'function') initTheme();
    if (typeof checkCookieConsent === 'function') checkCookieConsent();

    const searchInput = document.getElementById('search-input');
    if (searchInput) searchInput.addEventListener('input', filterArticles);

    window.addEventListener('click', function (e) {
        const articleModal = document.getElementById('article-modal');
        const searchModal = document.getElementById('search-modal');
        const xmlModal = document.getElementById('xml-modal');
        if (articleModal && e.target === articleModal) closeArticleModal();
        if (searchModal && e.target === searchModal) toggleSearchModal();
        if (xmlModal && e.target === xmlModal) closeXmlModal();
    });
});

window.addEventListener('load', function () {
    if (typeof checkCookieConsent === 'function') checkCookieConsent();
});
"""
          (root/"assets/js/main.js").write_text(main_js.strip() + "\n", encoding="utf-8")

          html = html.replace(
              '<script src="https://cdn.tailwindcss.com"></script>',
              '<script src="assets/js/tailwind-config.js"></script>\n    <script src="https://cdn.tailwindcss.com"></script>'
          )
          js_files = [
              "assets/js/data/articles.js",
              "assets/js/i18n/translations.js",
              "assets/js/modules/theme.js",
              "assets/js/modules/modal.js",
              "assets/js/modules/drawer.js",
              "assets/js/modules/features.js",
              "assets/js/main.js"
          ]
          tags = "\n".join(f'    <script src="{p}"></script>' for p in js_files)
          html = html.replace("</body>", "\n" + tags + "\n</body>")
          src.write_text(html, encoding="utf-8")

      - name: Validate
        run: |
          test -f index.html
          test -f assets/css/style.css
          test -f assets/js/main.js
          test -f assets/js/data/articles.js
          test -f assets/js/i18n/translations.js
          test -f assets/js/modules/theme.js
          test -f assets/js/modules/modal.js
          test -f assets/js/modules/drawer.js
          test -f assets/js/modules/features.js
          ! grep -qi '<style' index.html
          ! grep -q 'function switchLanguage' index.html
          ! grep -q 'const articlesDB' index.html

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets
          git diff --cached --quiet && exit 0
          git commit -m "refactor: modularize Magic SEO architecture"
          git push
