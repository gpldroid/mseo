name: Extract mseo archive in PR

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  extract:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Extract archive into repository root
        run: |
          rm -rf /tmp/mseo-extract
          mkdir -p /tmp/mseo-extract
          unzip -q mseo-main.zip -d /tmp/mseo-extract
          cp -a /tmp/mseo-extract/mseo-main/. .
          rm -rf /tmp/mseo-extract
          rm -f .github/workflows/extract-mseo.yml .github/workflows/extract-mseo-pr.yml
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Extract mseo-main archive into repository"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
