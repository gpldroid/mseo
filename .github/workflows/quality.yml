name: MSEO quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify pinned Bulma foundation
        run: grep -q 'bulma@1.0.4/css/bulma.min.css' assets/css/site.css
      - name: Build generated catalogue and sitemap
        run: npm run build
      - name: Validate JavaScript modules and site SEO
        run: npm test
