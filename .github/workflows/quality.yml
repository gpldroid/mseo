name: MSEO quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      MSEO_SITE_URL: https://fastseo.site/
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify unified public-site assets
        run: |
          test -f assets/css/style.css
          test -f assets/js/site.js
          ! grep -R -E 'assets/css/(site|tailwind|home-rebuild)[.]css|assets/js/(home-rebuild|archive)[.]js' --include='*.html' .
      - name: Build generated catalogue and sitemap
        run: npm run build

      - name: Generate social previews and final Open Graph metadata
        run: npm run generate:social-images
      - name: Check social preview assets for legacy branding
        run: |
          ! grep -R -F 'MSEO' --include='*.svg' assets/images/social-previews
          ! grep -R -F 'gpldroid.github.io/mseo' --include='*.svg' assets/images/social-previews
          ! grep -R -F 'mseopro.netlify.app' --include='*.svg' assets/images/social-previews

      - name: Validate JavaScript modules and site structure
        run: npm test
      - name: Audit SEO metadata and internal links
        run: npm run audit:seo
      - name: Install dashboard dependencies
        run: npm install --prefix admin-dashboard --no-audit --no-fund
      - name: Build dashboard for the Netlify subpath
        run: VITE_BASE_PATH=/admin-dashboard/ MSEO_MONOREPO_BUILD=true npm run build --prefix admin-dashboard
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
      - name: Assemble and verify Netlify publish directory
        run: |
          node scripts/assemble-netlify.mjs
          test -f dist/index.html
          test -f dist/articles/ai-coding-prompts.html
          test -f dist/admin-dashboard/index.html
          find dist/admin-dashboard/assets -maxdepth 1 -type f -name '*.js' | grep -q .
