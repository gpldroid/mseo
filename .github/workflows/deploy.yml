name: Deploy MSEO to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "20.x"
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: node scripts/generate-sitemap.mjs
      - run: node scripts/validate-site.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: mseo-validation
          path: |
            data/articles.json
            sitemap.xml
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "20.x"
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: node scripts/generate-sitemap.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4