name: Extract bundled archive

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  extract:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract archive
        run: |
          set -e
          if [ ! -f mseo-main.zip ]; then
            echo "Archive already extracted."
            exit 0
          fi
          rm -rf /tmp/mseo-extract
          mkdir -p /tmp/mseo-extract
          unzip -q -o mseo-main.zip -d /tmp/mseo-extract
          test -d /tmp/mseo-extract/mseo-main
          cp -a /tmp/mseo-extract/mseo-main/. .
          rm -f .github/workflows/deploy.yml
          rm -rf /tmp/mseo-extract mseo-main.zip mseo-main
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Extract project files from bundled archive"
          git push
