name: MSEO Rebuild and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mseo-pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare source for Astro build
        run: npm run strip:styles

      - name: Run JavaScript syntax checks
        run: npm run check:js

      - name: Build the complete static site
        run: npm run build

      - name: Verify the single 3D tab bar and generated pages
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/assets/css/mseo-3d-tabs.css
          test -s dist/assets/js/mseo-bottom-tabs.js
          test -s dist/sitemap.xml
          test -d dist/articles
          test -d dist/pages
          css_count="$(find dist -type f -name '*.css' | wc -l | tr -d ' ')"
          test "$css_count" = "1"
          grep -R -q 'href="/assets/css/mseo-3d-tabs.css"' dist --include='*.html'
          grep -q 'mseo-bottom-tabs' dist/index.html
          if grep -R -qi '<style[[:space:]>]' dist --include='*.html'; then
            echo "Unexpected inline style block in generated HTML"
            exit 1
          fi
          echo "Build verification passed: one 3D tab bar stylesheet is present."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
