name: Static site validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node scripts/check-javascript.mjs
      - name: Validate static site inventory, sitemap and RSS
        run: node scripts/validate-site.mjs
      - name: Audit local assets
        run: node scripts/audit-assets.mjs
      - name: Audit SEO metadata and internal links
        run: node scripts/audit-seo.mjs
      - name: Report language coverage
        run: node scripts/audit-translations.mjs
