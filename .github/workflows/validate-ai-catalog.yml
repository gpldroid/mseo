name: Validate AI catalog and WebMCP
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/ai-catalog-webmcp]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Normalize image loading and dimensions
        run: npm run fix:images
      - name: Run unified project audit
        run: npm run audit:ci
      - name: Verify generated site, sitemap and RSS feed
        run: npm run build
