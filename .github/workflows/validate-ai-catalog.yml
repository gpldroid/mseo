name: Validate AI catalog and WebMCP
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/ai-catalog-webmcp]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate AI catalog and WebMCP schemas
        run: node scripts/validate-ai-catalog.mjs
      - name: Check JavaScript syntax
        run: |
          node --check assets/js/webmcp.js
          node --check assets/js/site.js
