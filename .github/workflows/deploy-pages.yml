name: Deploy website and admin dashboard to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MSEO_SITE_URL: https://fastseo.site/
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build public site data
        run: npm run build

      - name: Generate contextual social images for pages missing in-content images
        run: npm run generate:social-images

      - name: Install dashboard dependencies
        run: npm install --prefix admin-dashboard --no-audit --no-fund

      - name: Build dashboard for GitHub Pages project path
        run: npm run build --prefix admin-dashboard
        env:
          VITE_BASE_PATH: /mseo/admin-dashboard/
          MSEO_MONOREPO_BUILD: "true"

      - name: Assemble site and dashboard
        run: |
          node scripts/assemble-netlify.mjs
          test -f dist/feed.xml
          ! grep -R -E 'https?://(gpldroid\.github\.io/mseo|mseopro\.netlify\.app)' --include='*.html' --exclude='admin.html' dist/index.html dist/article.html dist/articles dist/pages
          ! grep -R -F '<meta property="og:site_name" content="MSEO">' --include='*.html' --exclude='admin.html' dist/index.html dist/article.html dist/articles dist/pages

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
