name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Remove CSS from repository source files
        run: npm run strip:styles
      - name: Commit source cleanup
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Remove CSS styling from source files"
            git push
          fi
      - name: Install dependencies
        run: npm install
      - name: Normalize SEO metadata and image loading
        run: npm run fix:seo && npm run fix:images
      - name: Run unified project audit
        run: npm run audit:ci
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build Astro static site
        run: npm run build
      - name: Verify Astro output and navigation
        run: |
          test -s dist/index.html
          test -s dist/assets/css/mseo-3d-tabs.css
          test "$(find dist -type f -name '*.css' | wc -l)" -eq 1
          test -s dist/assets/js/mseo-bottom-tabs.js
          test -s dist/sitemap.xml
          grep -q 'mseo-bottom-tabs' dist/index.html
          grep -R -q 'href="/assets/css/mseo-3d-tabs.css"' dist --include='*.html'
          if grep -R -qi '<style[[:space:]>]' dist --include='*.html'; then echo 'Unexpected style block in static output'; exit 1; fi
          test -d dist/articles
          test -d dist/pages
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
