name: Validate Astro static build

on:
  pull_request:
    branches: [main]
    paths:
      - 'astro.config.mjs'
      - 'src/**'
      - 'articles/**'
      - 'pages/**'
      - 'assets/**'
      - 'data/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check JavaScript syntax
        run: npm run check:js
      - name: Build Astro static site
        run: npm run build
      - name: Verify generated site
        run: |
          test -s dist/index.html
          test -s dist/assets/css/mseo-3d-system.css
          test -s dist/assets/js/mseo-bottom-tabs.js
          test -s dist/sitemap.xml
          grep -q 'mseo-bottom-tabs' dist/index.html
          test -d dist/articles
          test -d dist/pages
