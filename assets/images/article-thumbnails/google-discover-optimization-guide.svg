<rect width="1200" height="630" rx="34" fill="url(#bg)"/><circle cx="1040" cy="120" r="190" fill="#6ca4ff" opacity=".09"/><circle cx="145" cy="580" r="210" fill="#43d9c5" opacity=".08"/>
