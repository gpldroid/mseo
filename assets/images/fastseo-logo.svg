<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Fast SEO — فاست سيو</title><desc id="desc">Premium three-dimensional metallic blue and cyan SEO emblem with a forward arrow and Arabic-English wordmark.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101a31"/><stop offset=".55" stop-color="#152744"/><stop offset="1" stop-color="#07101e"/></linearGradient>
<linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5fdff"/><stop offset=".16" stop-color="#a9eaff"/><stop offset=".32" stop-color="#298de8"/><stop offset=".53" stop-color="#1451b8"/><stop offset=".72" stop-color="#67dfff"/><stop offset="1" stop-color="#f5fdff"/></linearGradient>
<linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b9ffff"/><stop offset=".38" stop-color="#2bd4f4"/><stop offset="1" stop-color="#1672da"/></linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#fff0b5"/><stop offset=".35" stop-color="#ffbd4a"/><stop offset=".72" stop-color="#ed762a"/><stop offset="1" stop-color="#8b351e"/></linearGradient>
<linearGradient id="word" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#b9d9ff"/></linearGradient>
<radialGradient id="glow"><stop stop-color="#258dff" stop-opacity=".42"/><stop offset="1" stop-color="#258dff" stop-opacity="0"/></radialGradient>
<filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur in="SourceAlpha" stdDeviation="8"/><feOffset dy="12" dx="3"/><feComponentTransfer><feFuncA type="linear" slope=".55"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="shine" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
