[build]
  command = "npm run build && npm run generate:social-images && npm install --prefix admin-dashboard --no-audit --no-fund && VITE_BASE_PATH=/admin-dashboard/ MSEO_MONOREPO_BUILD=true npm run build --prefix admin-dashboard && node scripts/assemble-netlify.mjs"
  publish = "dist"

[build.environment]
  MSEO_SITE_URL = "https://fastseo.site/"

# Permanently consolidate the retired Netlify hostname onto the production domain.
# Keep the exact root rule before the wildcard so the homepage also redirects cleanly.
[[redirects]]
  from = "https://mseopro.netlify.app"
  to = "https://fastseo.site/"
  status = 301
  force = true

[[redirects]]
  from = "https://mseopro.netlify.app/*"
  to = "https://fastseo.site/:splat"
  status = 301
  force = true
